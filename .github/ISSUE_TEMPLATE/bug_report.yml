name: 버그 신고
description: 재현 가능한 문제를 알려주세요.
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: 문제 설명
      description: 민감정보를 제외하고 문제를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: 브라우저, 화면 크기, 관련 경로 등을 작성해 주세요.
